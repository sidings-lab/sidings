name: Bug report
description: Report a reproducible problem in Sidings.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Sidings. Remove secrets and private repository content from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Sidings version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows via WSL
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime versions
      description: Include Node.js, tmux, and the affected agent CLI versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      render: shell
