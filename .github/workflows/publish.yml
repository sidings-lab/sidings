name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm verify-build -- --static
      - name: Match the release tag to the package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Publish with npm provenance
        run: npm publish --access public --provenance
